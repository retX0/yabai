name: build

# Fork CI for retX0/yabai.
#   push to `release` / PR / manual run -> build, check, upload a workflow artifact
#   push a tag like v7.1.25-retx0.1     -> same, then publish a GitHub pre-release

on:
  push:
    branches: [release]
    tags: ['v*-retx0.*']
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Build (release flags)
        run: make install

      - name: Version
        id: meta
        run: |
          version="$(./bin/yabai --version)"
          echo "$version"
          case "$version" in
            yabai-v*-retx0.*) ;;
            *) echo "::error::version '$version' has no -retx0.N suffix"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "yabai-$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match binary version '$version'"
            exit 1
          fi

      - name: Check binary
        run: |
          archs="$(lipo -archs bin/yabai)"
          echo "archs: $archs"
          for a in x86_64 arm64; do
            case " $archs " in *" $a "*) ;; *) echo "::error::missing arch $a"; exit 1 ;; esac
          done

      - name: Check standalone payload has no unresolved symbols
        run: |
          tmp="$RUNNER_TEMP/blob"
          mkdir -p "$tmp"
          xcrun clang src/osax/sa_payload.c -arch arm64e -O2 -fno-stack-protector -fno-stack-check -c -o "$tmp/p.o"
          xcrun ld -arch arm64e -e _blob_entry -o "$tmp/img" "$tmp/p.o" -lSystem \
            -syslibroot "$(xcrun --show-sdk-path)" -platform_version macos 26.0 26.0
          undefined="$(nm -u "$tmp/img")"
          if [ -n "$undefined" ]; then
            echo "::error::payload has unresolved symbols"
            echo "$undefined"
            exit 1
          fi
          echo "payload: 0 unresolved symbols"

      - name: Package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Ad-hoc signature. Users should re-sign with their own certificate
          # so the Accessibility permission survives updates.
          codesign -fs - bin/yabai
          codesign -dv bin/yabai
          # Same layout as `make archive` (man page is committed in doc/).
          rm -rf archive
          mkdir -p archive
          cp -r bin doc examples archive/
          mkdir -p dist
          tar -czf "dist/$VERSION.tar.gz" archive
          (cd dist && shasum -a 256 "$VERSION.tar.gz" > "$VERSION.tar.gz.sha256")
          cat "dist/$VERSION.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.version }}
          path: dist

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Unofficial fork build of yabai with the standalone Apple Silicon scripting-addition loader
          (see asmvik/yabai#2826). Not an upstream release.

          **SIP:** `csrutil enable --without debug` only. No `--without fs`, no `-arm64e_preview_abi`,
          AMFI stays enabled.

          **Loader:** `sudo yabai --load-sa` installs the loader setuid-root, so yabai can
          re-inject after a Dock restart without sudo. It only injects the payload built into it.

          **Signing:** the binary is ad-hoc signed by CI. Re-sign it with your own certificate
          (`codesign -fs <your-cert> /path/to/yabai`) so the Accessibility permission is kept
          across updates.

          Verify the download with the `.sha256` file.
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "$TAG" \
            --notes-file notes.md
